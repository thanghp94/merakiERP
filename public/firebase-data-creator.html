<!DOCTYPE html>
<html>
<head>
    <title>Firebase Data Creator</title>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

        const firebaseConfig = {

            messagingSenderId: '43864479507',
            appId: '1:43864479507:web:1e49c99267ade2c37d6ce6'

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function createSampleData() {
            try {

                output.innerHTML += '🌱 Creating sample collections and data...<br>';
                
                // Create facilities
                output.innerHTML += '🏢 Creating facilities...<br>';
                const facility1 = await addDoc(collection(db, 'facilities'), {

                output.innerHTML += `✅ Facility 2 ID: ${facility2.id}<br>`;

                output.innerHTML += '👨‍🏫 Creating employees...<br>';

                    full_name: 'Michael Chen',
                    email: 'michael.chen@merakierp.com',
                    phone: '0902-345-678',
                    position: 'English Teacher',
                    status: 'active',
                    data: {
                        hire_date: '2023-06-01',
                        specialization: ['Grammar', 'Conversation', 'Business English'],
                        experience_years: 5
                    },
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                });
                
                output.innerHTML += `✅ Employee 1 ID: ${employee1.id}<br>`;
                output.innerHTML += `✅ Employee 2 ID: ${employee2.id}<br>`;
                
                // Create classes
                output.innerHTML += '📚 Creating classes...<br>';
                const class1 = await addDoc(collection(db, 'classes'), {
                    class_name: 'English Beginner A1 - Morning',
                    facility_id: facility1.id,
                    status: 'active',
                    start_date: '2024-01-15',
                    data: {
                        end_date: '2024-04-15',
                        level: 'beginner',
                        max_students: 15,
                        schedule: {
                            days: ['Monday', 'Wednesday', 'Friday'],
                            time: '08:00-10:00'
                        },
                        instructor_id: employee1.id,
                        description: 'Basic English for absolute beginners'
                    },
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                });
                
                const class2 = await addDoc(collection(db, 'classes'), {
                    class_name: 'IELTS Preparation - Evening',

                    status: 'active',
                    start_date: '2024-02-01',

                });
                
                const class3 = await addDoc(collection(db, 'classes'), {
                    class_name: 'Business English - Afternoon',
                    facility_id: facility2.id,
                    status: 'active',
                    start_date: '2024-03-01',

                            days: ['Monday', 'Wednesday'],
                            time: '14:00-16:00'
                        },
                        instructor_id: employee2.id,
                        description: 'Professional English for business contexts'
                    },
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                });
                
                output.innerHTML += `✅ Class 1 ID: ${class1.id}<br>`;
                output.innerHTML += `✅ Class 2 ID: ${class2.id}<br>`;
                output.innerHTML += `✅ Class 3 ID: ${class3.id}<br>`;
                
                // Create students
                output.innerHTML += '👨‍🎓 Creating students...<br>';
                const student1 = await addDoc(collection(db, 'students'), {
                    full_name: 'Nguyen Van An',

                        expected_campus: 'CS1',

                        parent: {
                            name: 'Nguyen Van Ba',
                            phone: '0913-456-789',

                        },

                    updated_at: new Date().toISOString()

                const student2 = await addDoc(collection(db, 'students'), {

                    email: 'linh.tran@email.com',
                    phone: '0987-654-321',

                output.innerHTML += `✅ Student 1 ID: ${student1.id}<br>`;
                output.innerHTML += `✅ Student 2 ID: ${student2.id}<br>`;
                output.innerHTML += `✅ Student 3 ID: ${student3.id}<br>`;
                
                // Create enrollments
                output.innerHTML += '📝 Creating enrollments...<br>';
                const enrollment1 = await addDoc(collection(db, 'enrollments'), {
                    student_id: student1.id,
                    class_id: class2.id,
                    enrollment_date: '2024-01-20',
                    status: 'active',
                    data: {
                        payment_status: 'paid',
                        enrollment_fee: 2500000,
                        notes: 'Full payment received'
                    },
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                });
                
                const enrollment2 = await addDoc(collection(db, 'enrollments'), {
                    student_id: student2.id,
                    class_id: class1.id,
                    enrollment_date: '2024-01-10',
                    status: 'active',
                    data: {
                        payment_status: 'partial',

                    updated_at: new Date().toISOString()

                const enrollment3 = await addDoc(collection(db, 'enrollments'), {
                    student_id: student3.id,
                    class_id: class3.id,
                    enrollment_date: '2024-02-15',

                    },
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                });
                
                output.innerHTML += `✅ Enrollment 1 ID: ${enrollment1.id}<br>`;
                output.innerHTML += `✅ Enrollment 2 ID: ${enrollment2.id}<br>`;
                output.innerHTML += `✅ Enrollment 3 ID: ${enrollment3.id}<br>`;
                
                // Create finances
                output.innerHTML += '💰 Creating finances...<br>';
                const finance1 = await addDoc(collection(db, 'finances'), {
                    student_id: student1.id,
                    amount: 2500000,
                    transaction_type: 'payment',
                    transaction_date: '2024-01-20',
                    status: 'completed',
                    description: 'IELTS Course Enrollment Fee',
                    data: {
                        payment_method: 'bank_transfer',
                        reference_number: 'TXN-2024-001'
                    },
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                });
                
                const finance2 = await addDoc(collection(db, 'finances'), {
                    student_id: student2.id,
                    amount: 900000,
                    transaction_type: 'payment',
                    transaction_date: '2024-01-10',
                    status: 'completed',
                    description: 'Beginner Course - Partial Payment',
                    data: {
                        payment_method: 'cash',
                        reference_number: 'TXN-2024-002'
                    },
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                });
                
                const finance3 = await addDoc(collection(db, 'finances'), {
                    student_id: student3.id,
                    amount: 3000000,
                    transaction_type: 'payment',
                    transaction_date: '2024-02-15',
                    status: 'completed',
                    description: 'Business English Course Fee',
                    data: {
                        payment_method: 'company_transfer',
                        reference_number: 'TXN-2024-003'
                    },
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                });
                
                output.innerHTML += `✅ Finance 1 ID: ${finance1.id}<br>`;
                output.innerHTML += `✅ Finance 2 ID: ${finance2.id}<br>`;
                output.innerHTML += `✅ Finance 3 ID: ${finance3.id}<br>`;
                
                output.innerHTML += '<br>🎉 All sample data created successfully!<br>';
                output.innerHTML += '<br>📋 Collections created:<br>';
                output.innerHTML += '🏢 facilities - 2 documents<br>';
                output.innerHTML += '👨‍🏫 employees - 2 documents<br>';
                output.innerHTML += '📚 classes - 3 documents<br>';
                output.innerHTML += '👨‍🎓 students - 3 documents<br>';
                output.innerHTML += '📝 enrollments - 3 documents<br>';
                output.innerHTML += '💰 finances - 3 documents<br>';
                output.innerHTML += '<br>🔗 View your data in Firebase Console:<br>';
                output.innerHTML += '<a href="https://console.firebase.google.com/project/merakierp/firestore" target="_blank">https://console.firebase.google.com/project/merakierp/firestore</a><br>';
                
            } catch (error) {
                document.getElementById('output').innerHTML += `❌ Error creating sample data: ${error.message}<br>`;
                console.error('Error:', error);
            }
        }

        // Make the function available globally
        window.createSampleData = createSampleData;
    </script>
</head>
<body>
    <h1>Firebase Sample Data Creator for MerakiERP</h1>
    <button onclick="createSampleData()">Create Sample Data</button>
    <div id="output" style="font-family: monospace; margin-top: 20px; padding: 10px; background: #f5f5f5;"></div>
</body>
</html>
